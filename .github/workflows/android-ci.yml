name: Android CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Allow manual runs from the Actions tab
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create local.properties with build secrets
        # Write sdk.dir plus the two build secrets.
        #
        # HF_TOKEN populates BuildConfig.HF_TOKEN so the app can authenticate
        # directly against the Hugging Face Space (the current BASE_URL).
        #
        # APP_KEY populates the XOR-obfuscated BuildConfig.APP_KEY_X used to
        # send the X-App-Key header to the Cloudflare Worker proxy. It must
        # match the value given to `wrangler secret put APP_KEY` — see
        # cloudflare-worker/README.md. It is only load-bearing AFTER BASE_URL
        # is switched to the Worker URL; until then the Space ignores it.
        #
        # Both fall back to an empty string when the repo secret is unset
        # (app/build.gradle.kts uses `?: ""`), so the build still succeeds on a
        # fork or a fresh clone with no secrets configured — the resulting APK
        # simply cannot reach the backend.
        working-directory: android-app
        run: |
          cat > local.properties <<EOF
          sdk.dir=$ANDROID_HOME
          HF_TOKEN=${{ secrets.HF_TOKEN }}
          APP_KEY=${{ secrets.APP_KEY }}
          EOF

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: android-app

      - name: Decode google-services.json
        # If the repo secret is unset, fall back to a mock Firebase config
        # so the google-services plugin doesn't fail the build. The mock
        # is sufficient for compilation; Firebase calls will simply no-op.
        run: |
          if [ -z "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" ]; then
            echo '{"project_info":{"project_number":"123","firebase_url":"https://mock.firebaseio.com","project_id":"mock","storage_bucket":"mock.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:123:android:123","android_client_info":{"package_name":"com.magazineforge.app"}},"api_key":[{"current_key":"mock"}]}]}' > android-app/app/google-services.json
          else
            echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > android-app/app/google-services.json
          fi

      - name: Build Debug APK
        # Debug build is faster, needs no signing config, and produces an
        # APK that can be installed directly on a device for testing.
        # --no-daemon keeps the CI environment clean.
        run: ./gradlew assembleDebug --no-daemon
        working-directory: android-app

      - name: Upload Debug APK
        # `if: always()` ensures the APK is uploaded even if a downstream
        # step (tests, lint) fails. The user just wants the APK; we
        # shouldn't withhold it because of a flaky lint warning.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: magazineforge-debug-apk
          path: android-app/app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Run Unit Tests
        # Tests run AFTER the upload so a test failure doesn't block the
        # APK from being published — the upload step above uses `if: always()`
        # and has already completed by this point.
        #
        # NOTE: `continue-on-error: true` was removed here. It made every test
        # failure a green check, so a broken test was indistinguishable from a
        # passing one. There are currently no test sources under app/src/test,
        # so this step runs zero tests and passes trivially; removing the flag
        # changes nothing today and makes failures real once tests are added.
        run: ./gradlew testDebugUnitTest --no-daemon
        working-directory: android-app
