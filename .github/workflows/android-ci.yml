name: Android CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Allow manual runs from the Actions tab
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create local.properties with HF_TOKEN
        # Write both sdk.dir and HF_TOKEN (if the repo secret is set) so
        # BuildConfig.HF_TOKEN is populated and the app can authenticate
        # against the private Hugging Face Space at runtime. If the secret
        # is not set, HF_TOKEN falls back to an empty string and the build
        # still succeeds — the app just won't be able to reach the backend
        # until the user enters credentials manually.
        working-directory: android-app
        run: |
          cat > local.properties <<EOF
          sdk.dir=$ANDROID_HOME
          HF_TOKEN=${{ secrets.HF_TOKEN }}
          EOF

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: android-app

      - name: Decode google-services.json
        # If the repo secret is unset, fall back to a mock Firebase config
        # so the google-services plugin doesn't fail the build. The mock
        # is sufficient for compilation; Firebase calls will simply no-op.
        run: |
          if [ -z "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" ]; then
            echo '{"project_info":{"project_number":"123","firebase_url":"https://mock.firebaseio.com","project_id":"mock","storage_bucket":"mock.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:123:android:123","android_client_info":{"package_name":"com.magazineforge.app"}},"api_key":[{"current_key":"mock"}]}]}' > android-app/app/google-services.json
          else
            echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > android-app/app/google-services.json
          fi

      - name: Build Debug APK
        # Debug build is faster, needs no signing config, and produces an
        # APK that can be installed directly on a device for testing.
        # --no-daemon keeps the CI environment clean.
        run: ./gradlew assembleDebug --no-daemon
        working-directory: android-app

      - name: Upload Debug APK
        # `if: always()` ensures the APK is uploaded even if a downstream
        # step (tests, lint) fails. The user just wants the APK; we
        # shouldn't withhold it because of a flaky lint warning.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: magazineforge-debug-apk
          path: android-app/app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Run Unit Tests
        # Tests run AFTER the upload so a test failure doesn't block the
        # APK from being published. Test results are still visible in the
        # Actions logs.
        run: ./gradlew testDebugUnitTest --no-daemon
        working-directory: android-app
        continue-on-error: true
