name: Android CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties
        working-directory: android-app

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: android-app

      - name: Decode google-services.json
        run: |
          if [ -z "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" ]; then
            echo '{"project_info":{"project_number":"123","firebase_url":"https://mock.firebaseio.com","project_id":"mock","storage_bucket":"mock.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:123:android:123","android_client_info":{"package_name":"com.magazineforge.app"}},"api_key":[{"current_key":"mock"}]}]}' > android-app/app/google-services.json
          else
            echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > android-app/app/google-services.json
          fi

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon
        working-directory: android-app

      - name: Run Unit Tests
        run: ./gradlew testReleaseUnitTest --no-daemon
        working-directory: android-app

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: release-apk
          path: android-app/app/build/outputs/apk/release/*.apk
          retention-days: 14

  lint:
    name: Lint Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties
        working-directory: android-app

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: android-app

      - name: Decode google-services.json
        run: |
          if [ -z "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" ]; then
            echo '{"project_info":{"project_number":"123","firebase_url":"https://mock.firebaseio.com","project_id":"mock","storage_bucket":"mock.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:123:android:123","android_client_info":{"package_name":"com.magazineforge.app"}},"api_key":[{"current_key":"mock"}]}]}' > android-app/app/google-services.json
          else
            echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > android-app/app/google-services.json
          fi

      - name: Run Lint
        run: ./gradlew lintRelease --no-daemon
        working-directory: android-app
