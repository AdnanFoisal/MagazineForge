# Project-wide Gradle settings.
# 1024m is not enough for R8: `assembleRelease` dies with "the JVM garbage
# collector is thrashing" during minifyReleaseWithR8. Debug builds are fine at
# 1g because they skip R8 entirely, so this only shows up on release builds.
# MaxMetaspaceSize is set explicitly because the Kotlin compiler daemon loads
# enough classes to exhaust an unbounded default on some JDKs.
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
