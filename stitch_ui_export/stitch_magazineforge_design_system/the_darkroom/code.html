<!-- Centered Breathing Shader Animation -->
<div class="absolute inset-0 flex items-center justify-center z-0 pointer-events-none">
<!-- Using opacity to make it a subtle atmospheric background -->
<!-- STITCH_SHADER_START:ANIMATION_33 class="w-full h-full md:w-[80vw] md:h-[707px] opacity-40 mix-blend-screen rounded-full blur-3xl" -->
<div class="w-full h-full md:w-[80vw] md:h-[707px] opacity-40 mix-blend-screen rounded-full blur-3xl" style="display:block;">
<canvas id="shader-canvas-ANIMATION_33" style="display:block;width:100%;height:100%"></canvas>
<script>
(function() {
  const canvas = document.getElementById('shader-canvas-ANIMATION_33');

  // Sync the WebGL drawing-buffer size with the CSS-driven layout size.
  // This fires on initial layout and whenever the element is resized.
  function syncSize() {
    const w = canvas.clientWidth  || 1280;
    const h = canvas.clientHeight || 720;
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width  = w;
      canvas.height = h;
    }
  }
  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(syncSize).observe(canvas);
  }
  syncSize();

  const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
  if (!gl) return;
  const vs = `attribute vec2 a_position;
varying vec2 v_texCoord;
void main() {
  v_texCoord = a_position * 0.5 + 0.5;
  gl_Position = vec4(a_position, 0.0, 1.0);
}`;
  const fs = `precision highp float;
uniform float u_time;
uniform vec2 u_resolution;

void main() {
    vec2 uv = gl_FragCoord.xy / u_resolution.xy;
    float pulse = (sin(u_time * 1.5) * 0.5 + 0.5) * 0.3 + 0.7; // Breathing scale
    
    // Centered radial gradient
    vec2 center = vec2(0.5, 0.5);
    float d = distance(uv, center);
    
    // Editorial Gold / Muted Blue breathing gradient
    vec3 color1 = vec3(0.83, 0.69, 0.22); // #D4AF37
    vec3 color2 = vec3(0.1, 0.1, 0.1);    // Pitch Black
    
    float circle = smoothstep(0.3 * pulse, 0.0, d);
    vec3 finalColor = mix(color2, color1, circle * 0.4);
    
    gl_FragColor = vec4(finalColor, 1.0);
}`;
  function cs(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, cs(gl.VERTEX_SHADER, vs));
  gl.attachShader(prog, cs(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog);
  gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const pos = gl.getAttribLocation(prog, 'a_position');
  gl.enableVertexAttribArray(pos);
  gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);
  const uTime = gl.getUniformLocation(prog, 'u_time');
  const uRes = gl.getUniformLocation(prog, 'u_resolution');
  const uMouse = gl.getUniformLocation(prog, 'u_mouse');

  // u_mouse is in pixel coordinates matching u_resolution (ShaderToy convention).
  // Shaders that need normalized coords should use: u_mouse / u_resolution.
  let mouse = { x: canvas.width / 2, y: canvas.height / 2 };
  window.addEventListener('mousemove', (event) => {
    const rect = canvas.getBoundingClientRect();
    if (rect.width && rect.height) {
      const nx = (event.clientX - rect.left) / rect.width;
      const ny = 1.0 - (event.clientY - rect.top) / rect.height;
      mouse.x = nx * canvas.width;
      mouse.y = ny * canvas.height;
    }
  });

  function render(t) {
    if (typeof ResizeObserver === 'undefined') syncSize();
    gl.viewport(0, 0, canvas.width, canvas.height);
    if (uTime) gl.uniform1f(uTime, t * 0.001);
    if (uRes) gl.uniform2f(uRes, canvas.width, canvas.height);
    if (uMouse) gl.uniform2f(uMouse, mouse.x, mouse.y);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(render);
  }
  render(0);
})();
</script>

<style>
        @keyframes progress {
            0% { width: 0%; opacity: 0; }
            10% { opacity: 1; }
            50% { width: 60%; }
            100% { width: 100%; opacity: 0; }
        }
        .animate-progress {
            animation: progress 10s infinite linear;
        }
    </style>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const processingTexts = [
                "Curating visual assets...",
                "Typesetting via LuaLaTeX...",
                "Orchestrating layout with Gemini...",
                "Applying high-end editorial constraints...",
                "Rendering final composition..."
            ];
            
            const textElement = document.getElementById('processing-text');
            let currentTextIndex = 0;

            setInterval(() => {
                // Fade out
                textElement.style.opacity = '0';
                
                setTimeout(() => {
                    // Update text
                    currentTextIndex = (currentTextIndex + 1) % processingTexts.length;
                    textElement.textContent = processingTexts[currentTextIndex];
                    
                    // Fade in
                    textElement.style.opacity = '1';
                }, 700); // Wait for fade out duration
            }, 3500); // Change text every 3.5 seconds

            // Optional: Simulate swipe down interaction visually (just for demo purposes)
            let touchStartY = 0;
            let touchEndY = 0;

            document.addEventListener('touchstart', e => {
                touchStartY = e.changedTouches[0].screenY;
            });

            document.addEventListener('touchend', e => {
                touchEndY = e.changedTouches[0].screenY;
                if (touchEndY > touchStartY + 50) { // Swiped down
                    // Add a visual minimize effect
                    document.body.style.transform = 'scale(0.95) translateY(20px)';
                    document.body.style.opacity = '0.5';
                    document.body.style.transition = 'all 0.4s cubic-bezier(0.16, 1, 0.3, 1)';
                    setTimeout(() => {
                        // Reset after a moment (in a real app, this would minimize to a pill)
                        document.body.style.transform = '';
                        document.body.style.opacity = '1';
                    }, 1000);
                }
            });
        });
    </script>
