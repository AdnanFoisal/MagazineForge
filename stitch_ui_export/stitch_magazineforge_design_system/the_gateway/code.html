<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>MagazineForge - Gateway</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

        tailwind.config = {
            darkMode: "class",
            theme: {

                        "surface-dim": "#121414",

                        "on-surface-variant": "#d0c5af",
                        "secondary-container": "#454747",
                        "surface-container-lowest": "#0d0e0f",
                        "primary-container": "#d4af37",
                        "error-container": "#93000a",
                        "on-tertiary-fixed": "#1c1b1b",
                        "on-tertiary": "#313030",
                        "surface-container-low": "#1b1c1c",
                        "surface-tint": "#e9c349",
                        "tertiary": "#d0cdcd",
                        "secondary-fixed": "#e2e2e2",
                        "inverse-primary": "#735c00",
                        "tertiary-fixed-dim": "#c8c6c5",
                        "on-primary": "#3c2f00",
                        "on-background": "#e3e2e2",
                        "on-primary-fixed": "#241a00",
                        "surface": "#121414",
                        "surface-bright": "#383939",
                        "on-secondary-fixed-variant": "#454747",
                        "surface-variant": "#343535",
                        "primary-fixed-dim": "#e9c349",
                        "inverse-surface": "#e3e2e2",
                        "secondary": "#c6c6c7",
                        "on-error-container": "#ffdad6",
                        "primary": "#f2ca50",
                        "background": "#121414",
                        "tertiary-fixed": "#e5e2e1",
                        "outline": "#99907c",
                        "on-error": "#690005",
                        "on-secondary": "#2f3131",
                        "inverse-on-surface": "#303031",
                        "on-secondary-container": "#b4b5b5",
                        "tertiary-container": "#b4b2b2",
                        "on-primary-fixed-variant": "#574500",
                        "error": "#ffb4ab",
                        "outline-variant": "#4d4635",
                        "secondary-fixed-dim": "#c6c6c7",
                        "surface-container-high": "#292a2a",
                        "surface-container": "#1f2020",
                        "on-surface": "#e3e2e2",
                        "on-secondary-fixed": "#1a1c1c"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {

                        "gutter": "16px",

                    },
                    "fontFamily": {

                }
            }
        }

<style>
        body {
            background-color: #000000; /* Overriding to absolute pitch black for this screen per prompt */
        }
        
        /* Custom input styling for the glowing bottom border effect */
        .auth-input {
            background-color: transparent !important;
            border: none;
            border-bottom: 1px solid #888888;
            border-radius: 0;
            box-shadow: none !important;
            transition: all 0.3s ease;
            color: white;
            padding-left: 0;
            padding-right: 0;
        }
        
        .auth-input:focus {
            border-bottom: 1px solid #ffffff;
            outline: none;
            box-shadow: 0 4px 10px -4px rgba(255, 255, 255, 0.3) !important;
        }

        .auth-input::placeholder {
            color: #454747; /* secondary-container */
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="text-on-surface h-screen flex flex-col items-center justify-center relative overflow-hidden">
<!-- Abstract subtle background element to add depth without breaking the pitch black -->
<div class="absolute inset-0 z-0 opacity-10 pointer-events-none" style="background-image: radial-gradient(circle at 50% 30%, rgba(212, 175, 55, 0.15) 0%, transparent 60%);">
</div>
<!-- Main Content Canvas -->
<main class="z-10 w-full max-w-md px-margin-page flex flex-col items-center justify-center text-center">
<!-- Typography Header -->
<h1 class="font-display-lg-mobile md:font-display-lg text-display-lg-mobile md:text-display-lg text-primary tracking-tighter mb-stack-sm">
            MagazineForge
        </h1>
<!-- Subtitle -->
<p class="font-body-lg text-body-lg text-on-surface-variant mb-stack-xl">
            Enter your Gemini Art Director Key.
        </p>
<!-- Auth Form -->
<form action="#" class="w-full flex flex-col gap-stack-lg" onsubmit="event.preventDefault(); animateUnlock();">
<div class="relative w-full flex flex-col items-start group">
<label class="font-label-sm text-label-sm text-secondary uppercase tracking-widest mb-2 transition-colors group-focus-within:text-on-surface" for="api-key">
                    API Key
                </label>
<input autocomplete="off" class="auth-input w-full font-body-lg text-body-lg py-3" id="api-key" placeholder="sk-..." required="" type="password"/>
<div class="absolute right-0 bottom-3 text-secondary group-focus-within:text-on-surface transition-colors">
<span class="material-symbols-outlined text-xl" style="font-variation-settings: 'FILL' 0;">key</span>
</div>
</div>
<!-- Action Button -->
<button class="w-full bg-primary-container text-on-primary py-4 rounded-lg font-label-md text-label-md uppercase tracking-widest hover:bg-primary-fixed transition-all duration-300 active:scale-95 mt-stack-md flex items-center justify-center gap-2 group" id="unlock-btn" type="submit">
<span>Unlock Studio</span>
<span class="material-symbols-outlined text-sm group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</form>
<!-- Optional helper link -->
<div class="mt-stack-lg">
<a class="font-label-sm text-label-sm text-secondary hover:text-on-surface transition-colors border-b border-transparent hover:border-on-surface pb-1" href="#">
                Where do I find my key?
            </a>
</div>
</main>
<script>
        function animateUnlock() {
            const btn = document.getElementById('unlock-btn');
            const originalContent = btn.innerHTML;
            
            // Loading state
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin text-sm">sync</span><span>Authenticating...</span>';
            btn.style.opacity = '0.8';
            btn.style.pointerEvents = 'none';
            
            // Simulate API call and transition
            setTimeout(() => {
                btn.innerHTML = '<span class="material-symbols-outlined text-sm" style="font-variation-settings: \'FILL\' 1;">lock_open</span><span>Access Granted</span>';
                btn.classList.remove('bg-primary-container', 'text-on-primary');
                btn.classList.add('bg-on-surface', 'text-surface');
                
                // Fade out page effect
                setTimeout(() => {
                    document.body.style.transition = 'opacity 0.8s ease';
                    document.body.style.opacity = '0';
                }, 800);
            }, 1500);
        }
    </script>
</body></html>
