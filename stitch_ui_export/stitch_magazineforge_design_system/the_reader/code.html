<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@600;700&amp;display=swap" rel="stylesheet"/>

<style>
        /* Force true pitch black for the infinite canvas feel */
        body { background-color: #000000; }
        
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }

        /* Reader UI Overlay Animation states */
        #reader-shell {
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
        }
        .ui-hidden #reader-shell {
            transform: translateY(-100%);
            opacity: 0;
            pointer-events: none;
        }
        
        #page-indicator {
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
        }
        .ui-hidden #page-indicator {
            transform: translateY(100%);
            opacity: 0;
            pointer-events: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="text-on-background h-screen w-screen overflow-hidden relative ui-hidden" id="reader-body">
<!-- TopAppBar overlay (Strictly adhering to JSON for component structure, but adapted as an overlay per prompt) -->
<header class="bg-surface-dim/90 backdrop-blur-xl fixed top-0 w-full border-b border-outline-variant/30 flex justify-between items-center px-margin-page h-16 z-50" id="reader-shell">
<button aria-label="Back" class="text-primary hover:opacity-80 transition-opacity active:scale-95">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<div class="font-headline-md text-headline-md text-primary tracking-tighter">
            MagazineForge
        </div>
<button aria-label="Add" class="text-primary hover:opacity-80 transition-opacity active:scale-95">
<span class="material-symbols-outlined" data-icon="add">add</span>
</button>
</header>
<!-- Immersive Content Canvas -->
<main aria-label="Toggle Reader Controls" class="h-full w-full relative cursor-pointer" id="tap-zone" role="button">
<!-- Full Bleed Editorial Spread -->
<img alt="Magazine Editorial Spread" class="w-full h-full object-cover object-center" data-alt="A striking, full-bleed high-fashion magazine double-page spread. The left page features a dramatic, cinematic portrait of a model in avant-garde black textured clothing against a stark white studio backdrop, exhibiting severe geometric posing. The right page displays bold, elegant serif typography and minimalist editorial layout with aggressive negative space on a deep pitch-black background. The overall aesthetic is ultra-luxurious, moody, and highly polished, embodying neo-minimalist digital editorial design." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDOv3oNJKgMKbMHQxLvMDJjGNsUP9BeLwxfxrBf4uxjoYgH2-AYobD-oZ_iBvn1DkoNzPBkvVVMA0GI0aaES7_u8h4pn1Gf0MxDp-GTArtMRmpXGAQYvEtmiTy3yqWkg3hPyd4EhTMmgprVmqekyT3cSnDxhaq1bRbz4T31j_N3QO3l8fT63p33atFr7_MHS3MbbGwFRtFC5wEEFf9XD-fRfQ9j9RfRyDhwmtgxDYXt-aTyfzNvRgXWizkkQITVoL5BSNXUzdLAdWo"/>
<!-- Subtle gradient overlay to ensure UI legibility when visible -->
<div class="absolute inset-0 bg-gradient-to-b from-black/40 via-transparent to-black/60 pointer-events-none opacity-0 transition-opacity duration-300" id="gradient-overlay"></div>
</main>
<!-- Bottom Page Indicator Overlay -->
<div class="fixed bottom-0 left-0 w-full flex justify-center pb-stack-md z-40" id="page-indicator">
<div class="bg-surface-dim/80 backdrop-blur-md px-6 py-2 rounded-full border border-outline-variant/30 font-label-md text-label-md text-primary tracking-widest uppercase shadow-[0_0_15px_rgba(0,0,0,0.5)]">
            Spread 04 — 05
        </div>
</div>
<!-- 
      Note: BottomNavBar is explicitly suppressed per relevance rules: 
      "Task-Focused: Any sub-page featuring a 'Close' or 'Back' action that implies a temporary departure from the main navigation flow."
      The immersive reader is a deeply focused state; showing global navigation here breaks the immersion.
    -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const body = document.getElementById('reader-body');
            const tapZone = document.getElementById('tap-zone');
            const gradientOverlay = document.getElementById('gradient-overlay');
            let isUIVisible = false;

            // Toggle UI visibility on tap anywhere on the canvas
            tapZone.addEventListener('click', () => {
                isUIVisible = !isUIVisible;
                
                if (isUIVisible) {
                    body.classList.remove('ui-hidden');
                    gradientOverlay.style.opacity = '1';
                } else {
                    body.classList.add('ui-hidden');
                    gradientOverlay.style.opacity = '0';
                }
            });
            
            // Allow keyboard toggling for accessibility
            tapZone.addEventListener('keypress', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    tapZone.click();
                }
            });
        });
    </script>
</body></html>
