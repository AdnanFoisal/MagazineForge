<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Article Settings - MagazineForge</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style type="text/tailwindcss">
        @layer utilities {
            .material-symbols-outlined {
                font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            }
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-low": "#1b1c1c",
                        "on-surface-variant": "#d0c5af",
                        "primary-fixed-dim": "#e9c349",
                        "inverse-on-surface": "#303031",
                        "inverse-primary": "#735c00",
                        "error-container": "#93000a",
                        "on-secondary": "#2f3131",
                        "on-primary-fixed-variant": "#574500",
                        "on-tertiary-fixed-variant": "#474746",
                        "on-background": "#e3e2e2",
                        "on-primary-container": "#554300",
                        "outline": "#99907c",
                        "on-tertiary-fixed": "#1c1b1b",
                        "on-primary-fixed": "#241a00",
                        "tertiary": "#d0cdcd",
                        "secondary-fixed": "#e2e2e2",
                        "on-secondary-container": "#b4b5b5",
                        "on-secondary-fixed-variant": "#454747",
                        "primary": "#f2ca50",
                        "on-tertiary": "#313030",
                        "tertiary-container": "#b4b2b2",
                        "inverse-surface": "#e3e2e2",
                        "surface-container-high": "#292a2a",
                        "secondary": "#c6c6c7",
                        "outline-variant": "#4d4635",
                        "primary-fixed": "#ffe088",
                        "on-tertiary-container": "#454544",
                        "surface-container-lowest": "#0d0e0f",
                        "surface-container-highest": "#343535",
                        "error": "#ffb4ab",
                        "background": "#121414",
                        "on-secondary-fixed": "#1a1c1c",
                        "on-error": "#690005",
                        "surface-dim": "#121414",
                        "tertiary-fixed": "#e5e2e1",
                        "primary-container": "#d4af37",
                        "surface-bright": "#383939",
                        "on-surface": "#e3e2e2",
                        "on-primary": "#3c2f00",
                        "surface-container": "#1f2020",
                        "secondary-fixed-dim": "#c6c6c7",
                        "secondary-container": "#454747",
                        "tertiary-fixed-dim": "#c8c6c5",
                        "surface-variant": "#343535",
                        "surface": "#121414",
                        "on-error-container": "#ffdad6",
                        "surface-tint": "#e9c349"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-lg": "40px",
                        "stack-sm": "12px",
                        "margin-page": "24px",
                        "gutter": "16px",
                        "stack-md": "24px",
                        "stack-xl": "64px"
                    },
                    "fontFamily": {
                        "headline-sm": ["Space Grotesk"],
                        "body-md": ["Inter"],
                        "display-lg-mobile": ["Space Grotesk"],
                        "display-lg": ["Space Grotesk"],
                        "headline-md": ["Space Grotesk"],
                        "body-lg": ["Inter"],
                        "label-sm": ["Inter"],
                        "label-md": ["Inter"]
                    },
                    "fontSize": {
                        "headline-sm": ["24px", { "lineHeight": "30px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "26px", "letterSpacing": "0em", "fontWeight": "400" }],
                        "display-lg-mobile": ["36px", { "lineHeight": "40px", "letterSpacing": "-0.03em", "fontWeight": "700" }],
                        "display-lg": ["48px", { "lineHeight": "52px", "letterSpacing": "-0.04em", "fontWeight": "700" }],
                        "headline-md": ["32px", { "lineHeight": "38px", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "30px", "letterSpacing": "0em", "fontWeight": "400" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "500" }],
                        "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface min-h-screen antialiased flex flex-col font-body-md overflow-hidden">
<!-- Overlay Container -->
<div class="fixed inset-0 z-50 flex flex-col bg-background/95 backdrop-blur-md">
<!-- Header -->
<header class="flex justify-between items-center px-margin-page h-16 w-full shrink-0 border-b border-surface-container-high/50">
<h1 class="font-headline-sm text-headline-sm text-on-surface">Article Settings</h1>
<button aria-label="Close Settings" class="text-on-surface-variant hover:text-primary transition-colors p-2 -mr-2">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</header>
<!-- Main Content (Scrollable) -->
<main class="flex-1 overflow-y-auto px-margin-page py-stack-md flex flex-col gap-stack-lg">
<!-- Section 1: Reading Preferences -->
<section class="flex flex-col gap-stack-md">
<h2 class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest border-b border-surface-container-high pb-2">Reading Preferences</h2>
<!-- Font Size Slider -->
<div class="bg-surface-container-low rounded-lg p-margin-page border border-surface-container-high flex flex-col gap-4">
<label class="font-body-md text-body-md text-on-surface flex justify-between">
<span>Adjust Font Size</span>
</label>
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-on-surface-variant" style="font-size: 16px;">format_size</span>
<input class="w-full h-1 bg-surface-container-high rounded-full appearance-none cursor-pointer accent-primary focus:outline-none focus:ring-2 focus:ring-primary/50" max="100" min="1" type="range" value="50"/>
<span class="material-symbols-outlined text-on-surface" style="font-size: 24px;">format_size</span>
</div>
</div>
<!-- Theme Toggle -->
<div class="bg-surface-container-low rounded-lg p-margin-page border border-surface-container-high flex justify-between items-center">
<span class="font-body-md text-body-md text-on-surface">Theme</span>
<div class="flex bg-surface-container-high rounded-full p-1 relative w-32 h-10">
<div class="absolute left-1 top-1 bottom-1 w-[calc(50%-4px)] bg-primary-container rounded-full shadow transition-transform translate-x-full"></div>
<button class="flex-1 flex items-center justify-center relative z-10 text-on-surface-variant transition-colors">
<span class="material-symbols-outlined text-[20px]">light_mode</span>
</button>
<button class="flex-1 flex items-center justify-center relative z-10 text-on-primary-container transition-colors">
<span class="material-symbols-outlined text-[20px]">dark_mode</span>
</button>
</div>
</div>
</section>
<!-- Section 2: Actions -->
<section class="flex flex-col gap-stack-md">
<h2 class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest border-b border-surface-container-high pb-2">Actions</h2>
<!-- Share Button -->
<button class="w-full bg-primary-container text-on-primary-container font-label-md text-label-md rounded-lg py-4 px-margin-page flex items-center justify-center gap-2 hover:opacity-90 transition-opacity">
<span class="material-symbols-outlined" data-icon="share">share</span>
                    Share Article
                </button>
<!-- Report Button -->
<button class="w-full bg-transparent border border-surface-container-high text-on-surface font-label-md text-label-md rounded-lg py-4 px-margin-page flex items-center justify-center gap-2 hover:bg-surface-container-low transition-colors">
<span class="material-symbols-outlined" data-icon="flag">flag</span>
                    Report Issue
                </button>
</section>
</main>
</div>
</body></html>
